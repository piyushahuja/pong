<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two lineages, one subject</title>
<style>
  :root{
    --ink:#1a1a1a; --muted:#666; --faint:#aaa; --border:#e5e5e5; --soft:#f7f7f7;
    --sup:#6e9ec8; --uns:#7ec87e; --rl:#c8a96e; --cyb:#9b8fa8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#fff;font-family:Georgia,serif;color:var(--ink);}
  .wrap{max-width:1060px;margin:0 auto;padding:10px 12px 4px;}
  .legend{display:flex;gap:1.1em;flex-wrap:wrap;align-items:center;margin:0 0 6px;font-size:12.5px;}
  .chip{display:flex;align-items:center;gap:.45em;cursor:pointer;padding:3px 8px;border:1px solid transparent;
        border-radius:20px;transition:background .15s,border-color .15s;user-select:none;}
  .chip:hover{background:var(--soft);border-color:var(--border);}
  .chip.off{opacity:.34;}
  .sw{width:15px;height:3px;border-radius:2px;display:inline-block;}
  .hint{margin-left:auto;color:var(--faint);font-size:11.5px;font-style:italic;}
  svg{width:100%;height:auto;display:block;}
  .lane-label{font-family:'Courier New',monospace;font-size:10.5px;letter-spacing:1.1px;}
  .lane-sub{font-family:Georgia,serif;font-size:10px;font-style:italic;fill:var(--faint);}
  .yr{font-family:'Courier New',monospace;font-size:10px;fill:var(--faint);}
  .nm{font-family:Georgia,serif;font-size:12.5px;fill:var(--ink);}
  .lvl{font-family:'Courier New',monospace;font-size:8px;letter-spacing:.6px;fill:#bbb;}
  .node{cursor:pointer;}
  .node circle{transition:r .12s;}
  .node:hover circle{r:7.5;}
  .dim{opacity:.13;transition:opacity .2s;}
  .lit{opacity:1;transition:opacity .2s;}
  #tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
       background:#1a1a1a;color:#f5f5f5;border-radius:6px;padding:.5em .75em;font-size:12px;
       line-height:1.5;max-width:270px;box-shadow:0 4px 18px rgba(0,0,0,.22);z-index:10;}
  #tip b{display:block;font-size:12.5px;margin-bottom:.25em;color:#fff;}
  #tip .t-yr{font-family:'Courier New',monospace;color:#999;font-size:10.5px;}
  .caption{font-size:12px;color:var(--muted);line-height:1.6;margin:2px 0 0;text-align:center;font-style:italic;}
</style>
</head>
<body>
<div class="wrap">
  <div class="legend" id="legend"></div>
  <div style="position:relative;">
    <svg id="viz" viewBox="0 0 1000 380" role="img"
         aria-label="Three learning signals traced from the 1890s to now: instructive (supervised), none (Hebbian), and evaluative (reinforcement), converging on modern systems."></svg>
    <div id="tip"></div>
  </div>
  <p class="caption">Ordered left to right, not drawn to scale. Hover any point; click a signal to isolate it.</p>
</div>

<script>
const LANES = [
  {id:'sup', y:96,  color:'var(--sup)', raw:'#6e9ec8', label:'INSTRUCTIVE', sub:'you are told the answer'},
  {id:'uns', y:196, color:'var(--uns)', raw:'#7ec87e', label:'NO SIGNAL',    sub:'nobody tells you anything'},
  {id:'rl',  y:296, color:'var(--rl)',  raw:'#c8a96e', label:'EVALUATIVE',   sub:'you are told how it went'}
];

const N = [
  {lane:'sup', x:70,  yr:'1891', nm:'Cajal',            lvl:'CELL',
   note:'The brain is discrete cells with gaps between them. A circuit to describe, not a fog.'},
  {lane:'rl',  x:120, yr:'1898', nm:'Thorndike',        lvl:'BEHAVIOUR',
   note:'Cats in a crate. Consequences re-weight what the animal already did — the law of effect.'},
  {lane:'rl',  x:275, yr:'1938', nm:'Skinner',          lvl:'BEHAVIOUR',
   note:'Reinforcement shapes elaborate behaviour by rewarding successive approximations. Gives the field its name.'},
  {lane:'sup', x:340, yr:'1943', nm:'McCulloch & Pitts',lvl:'CELL',
   note:'One cell abstracted into a threshold unit. It computes, and it cannot learn.'},
  {lane:'uns', x:432, yr:'1949', nm:'Hebb',             lvl:'CELL',
   note:'Cells that fire together wire together. No feedback at all, so it reinforces mistakes as cheerfully as successes.'},
  {lane:'rl',  x:500, yr:'1957–59', nm:'Bellman · Samuel', lvl:'ALGORITHM',
   note:'Value of a state = reward now + value of the next. And a draughts program that improves by playing itself.'},
  {lane:'sup', x:512, yr:'1958', nm:'Rosenblatt',       lvl:'ALGORITHM',
   note:'The perceptron. w ← w + η(t − y)x — a signed error, supplied by a person, for every example.'},
  {lane:'sup', x:578, yr:'1969', nm:'Minsky & Papert',  lvl:'ALGORITHM',
   note:'XOR cannot be cut by one line. Funding collapses; the first winter begins.', mark:'break'},
  {lane:'rl',  x:625, yr:'1972', nm:'Rescorla & Wagner',lvl:'BEHAVIOUR',
   note:'Animals learn only when events violate their expectations. Prediction error, stated as psychology, sixteen years before Sutton.'},
  {lane:'sup', x:692, yr:'1986', nm:'Rumelhart',        lvl:'ALGORITHM',
   note:'Backpropagation carries the same signed error through many layers. Cybenko follows in 1989: one hidden layer approximates anything.'},
  {lane:'rl',  x:748, yr:'1988', nm:'Sutton',           lvl:'ALGORITHM',
   note:'δ = r + V(next) − V(now). Temporal difference — close to Rescorla–Wagner with timing added, and made to run.'},
  {lane:'rl',  x:812, yr:'1997', nm:'Schultz',          lvl:'CELL',
   note:'Dopamine neurons behave quantitatively like δ. The idea left biology at the level of behaviour and came back at the level of a cell.'},
  {lane:'uns', x:830, yr:'2018→', nm:'self-supervised', lvl:'ALGORITHM',
   note:'The lane wakes up. Predict the next token over an enormous corpus — no labels, and no rewards either. This is the era of human data.'},
  {lane:'sup', x:893, yr:'2013', nm:'DQN',              lvl:'ALGORITHM', big:true,
   note:'A deep network placed inside a Q-learning loop. The supervised machinery and the reinforcement idea finally fuse.'}
];

const CYB = {x:395, yr:'1948', nm:'Wiener · cybernetics',
  note:'A machine that corrects itself using a signal about its own error. The common ancestor — feedback as an organising idea, feeding every lane on this chart.'};

const svg=document.getElementById('viz'), tip=document.getElementById('tip');
const NS='http://www.w3.org/2000/svg';
const el=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const laneOf=id=>LANES.find(l=>l.id===id);
let active=null;

// ── cybernetics spine ──
const gc=el('g',{class:'layer','data-lane':'cyb'});
gc.appendChild(el('line',{x1:CYB.x,y1:52,x2:CYB.x,y2:330,stroke:'#9b8fa8','stroke-width':1.3,'stroke-dasharray':'3 4'}));
const cybHit=el('rect',{x:CYB.x-60,y:36,width:120,height:26,fill:'transparent',class:'node'});
gc.appendChild(cybHit);
const ct=el('text',{x:CYB.x,y:46,'text-anchor':'middle',class:'nm',fill:'#8b7f98'});ct.textContent=CYB.nm;gc.appendChild(ct);
const cy=el('text',{x:CYB.x,y:32,'text-anchor':'middle',class:'yr'});cy.textContent=CYB.yr;gc.appendChild(cy);
svg.appendChild(gc);
bindTip(cybHit,CYB);

// ── lanes ──
LANES.forEach(L=>{
  const g=el('g',{class:'layer','data-lane':L.id});
  g.appendChild(el('line',{x1:150,y1:L.y,x2:975,y2:L.y,stroke:L.raw,'stroke-width':1.4,opacity:.38}));
  const t=el('text',{x:8,y:L.y-4,class:'lane-label',fill:L.raw});t.textContent=L.label;g.appendChild(t);
  const s=el('text',{x:8,y:L.y+10,class:'lane-sub'});s.textContent=L.sub;g.appendChild(s);
  svg.appendChild(g);
});

// ── convergence arcs into DQN ──
const gconv=el('g',{class:'layer','data-lane':'conv'});
gconv.appendChild(el('path',{d:'M756 288 C820 280, 862 250, 886 206',fill:'none',stroke:'#c8a96e','stroke-width':1.6}));
gconv.appendChild(el('polygon',{points:'891,198 879,208 890,212',fill:'#c8a96e'}));
gconv.appendChild(el('path',{d:'M700 104 C790 108, 852 118, 884 88',fill:'none',stroke:'#6e9ec8','stroke-width':1.6,opacity:.75}));
svg.appendChild(gconv);

// ── nodes ──
N.forEach(n=>{
  const L=laneOf(n.lane);
  const g=el('g',{class:'layer node','data-lane':n.lane});
  const up = (n.lane==='sup');
  g.appendChild(el('circle',{cx:n.x,cy:L.y,r:n.big?7:5.5,fill:L.raw}));
  if(n.mark==='break'){
    g.appendChild(el('line',{x1:n.x-4,y1:L.y-13,x2:n.x+4,y2:L.y+13,stroke:'#c0392b','stroke-width':1.6}));
  }
  const ny = up ? L.y-26 : L.y+30;
  const yy = up ? L.y-40 : L.y+44;
  const ly = up ? L.y-52 : L.y+56;
  const nt=el('text',{x:n.x,y:ny,'text-anchor':'middle',class:'nm'});nt.textContent=n.nm;g.appendChild(nt);
  const yt=el('text',{x:n.x,y:yy,'text-anchor':'middle',class:'yr'});yt.textContent=n.yr;g.appendChild(yt);
  const lt=el('text',{x:n.x,y:ly,'text-anchor':'middle',class:'lvl'});lt.textContent=n.lvl;g.appendChild(lt);
  g.appendChild(el('rect',{x:n.x-52,y:Math.min(ny,ly)-10,width:104,height:Math.abs(ly-L.y)+18,fill:'transparent'}));
  svg.appendChild(g);
  bindTip(g,n);
});

// ── the payoff line ──
const pay=el('text',{x:940,y:196,'text-anchor':'end',class:'lane-sub',fill:'#888'});
svg.appendChild(pay);

function bindTip(target,d){
  target.addEventListener('mousemove',e=>{
    tip.innerHTML='<b>'+d.nm+'</b><span class="t-yr">'+d.yr+'</span><br>'+d.note;
    tip.style.opacity=1;
    const r=svg.getBoundingClientRect();
    let x=e.clientX-r.left+14, y=e.clientY-r.top+14;
    if(x>r.width-285)x=e.clientX-r.left-285;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  });
  target.addEventListener('mouseleave',()=>{tip.style.opacity=0;});
}

// ── legend / isolation ──
const legend=document.getElementById('legend');
LANES.forEach(L=>{
  const c=document.createElement('div');c.className='chip';c.dataset.lane=L.id;
  c.innerHTML='<span class="sw" style="background:'+L.raw+'"></span>'+L.label.charAt(0)+L.label.slice(1).toLowerCase();
  c.onclick=()=>toggle(L.id);legend.appendChild(c);
});
const cc=document.createElement('div');cc.className='chip';cc.dataset.lane='cyb';
cc.innerHTML='<span class="sw" style="background:#9b8fa8"></span>Cybernetics';
cc.onclick=()=>toggle('cyb');legend.appendChild(cc);
const h=document.createElement('span');h.className='hint';h.textContent='click a signal to isolate it';legend.appendChild(h);

function toggle(id){
  active = (active===id) ? null : id;
  document.querySelectorAll('.layer').forEach(g=>{
    const l=g.dataset.lane;
    const on = !active || l===active || l==='conv';
    g.classList.toggle('dim',!on); g.classList.toggle('lit',on);
  });
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('off', !!active && c.dataset.lane!==active));
}
</script>
</body>
</html>
