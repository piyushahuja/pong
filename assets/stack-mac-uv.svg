<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img" aria-labelledby="title desc">
  <title id="title">Mac project stack with uv</title>
  <desc id="desc">Mac hosts uv for Python and dependencies, Gymnasium and ALE for Pong, NumPy for preprocessing, and PyTorch for the policy network.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7f6"/>
      <stop offset="100%" stop-color="#e8eef0"/>
    </linearGradient>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1a2b2e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="520" height="520" rx="18" fill="url(#bg)"/>

  <text x="260" y="40" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1a2b2e">Your Mac project stack</text>
  <text x="260" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6b70">Tooling and libraries used in this notebook</text>

  <!-- Mac root -->
  <g filter="url(#shadow)">
    <rect x="160" y="84" width="200" height="46" rx="10" fill="#1a2b2e"/>
  </g>
  <text x="260" y="113" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Mac</text>

  <line x1="260" y1="130" x2="260" y2="150" stroke="#8aa0a6" stroke-width="2"/>

  <!-- uv card -->
  <g filter="url(#shadow)">
    <rect x="70" y="150" width="380" height="78" rx="12" fill="#ffffff" stroke="#0d7377" stroke-width="2"/>
  </g>
  <text x="90" y="178" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700" fill="#0d7377">uv</text>
  <text x="90" y="202" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6b70">Python 3.12  ·  virtual environment  ·  dependency management</text>

  <line x1="260" y1="228" x2="260" y2="248" stroke="#8aa0a6" stroke-width="2"/>

  <!-- Gymnasium + ALE -->
  <g filter="url(#shadow)">
    <rect x="70" y="248" width="380" height="70" rx="12" fill="#ffffff" stroke="#0d7377" stroke-width="2"/>
  </g>
  <text x="90" y="276" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d7377">Gymnasium + ALE</text>
  <text x="90" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6b70">Pong simulator  ·  env.reset / env.step</text>

  <line x1="260" y1="318" x2="260" y2="338" stroke="#8aa0a6" stroke-width="2"/>

  <!-- NumPy -->
  <g filter="url(#shadow)">
    <rect x="70" y="338" width="380" height="70" rx="12" fill="#ffffff" stroke="#c45c26" stroke-width="2"/>
  </g>
  <text x="90" y="366" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#c45c26">NumPy</text>
  <text x="90" y="388" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6b70">image preprocessing (crop, downsample, binarize)</text>

  <line x1="260" y1="408" x2="260" y2="428" stroke="#8aa0a6" stroke-width="2"/>

  <!-- PyTorch -->
  <g filter="url(#shadow)">
    <rect x="70" y="428" width="380" height="70" rx="12" fill="#ffffff" stroke="#c45c26" stroke-width="2"/>
  </g>
  <text x="90" y="456" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#c45c26">PyTorch</text>
  <text x="90" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6b70">policy network + gradients + optimizer</text>
</svg>
