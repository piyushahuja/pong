[project]
name = "pong-pytorch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ale-py>=0.11.2",
    "gymnasium>=1.1.1",
    "matplotlib>=3.9.4",
    "pygame>=2.6.1",
    "torch>=2.8.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The modules under test sit at the project root, not in a package.
pythonpath = ["."]
testpaths = ["tests"]
